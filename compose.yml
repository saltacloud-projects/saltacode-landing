name: saltacode

x-runtime-defaults: &runtime-defaults
  init: true
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  stop_grace_period: 20s
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  frontend:
    <<: *runtime-defaults
    image: localhost/saltacode/frontend:${SALTACODE_RELEASE:-dev}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${SALTACODE_FRONTEND_BIND_ADDRESS:-127.0.0.1}:${SALTACODE_FRONTEND_PORT:-18080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 256M, pids: 128}
    networks: [ingress, frontend_backend]
    labels: {com.saltacode.component: frontend}

  backend:
    <<: *runtime-defaults
    image: localhost/saltacode/backend:${SALTACODE_RELEASE:-dev}
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SALTACODE_APP_ENV: ${SALTACODE_APP_ENV:-development}
      SALTACODE_ALLOWED_ORIGINS: ${SALTACODE_ALLOWED_ORIGINS:-http://localhost:18080}
      SALTACODE_AGENT_AI_BASE_URL: http://agent-platform:8000
      SALTACODE_AGENT_ROUTE_KEY: ${SALTACODE_AGENT_ROUTE_KEY:?set SALTACODE_AGENT_ROUTE_KEY}
      SALTACODE_AGENT_INTERNAL_TOKEN_FILE: /run/secrets/agent_internal_token
      SALTACODE_SESSION_SIGNING_SECRET_FILE: /run/secrets/session_signing_secret
      SALTACODE_RATE_LIMIT_BACKEND: ${SALTACODE_RATE_LIMIT_BACKEND:-redis}
      SALTACODE_REDIS_URL: ${SALTACODE_REDIS_URL:-redis://redis:6379/0}
      SALTACODE_RATE_LIMIT_REQUESTS: ${SALTACODE_RATE_LIMIT_REQUESTS:-20}
      SALTACODE_RATE_LIMIT_WINDOW_SECONDS: ${SALTACODE_RATE_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    ports:
      - "${SALTACODE_BACKEND_BIND_ADDRESS:-127.0.0.1}:${SALTACODE_BACKEND_PORT:-18081}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    pids_limit: 192
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 512M, pids: 192}
    networks: [frontend_backend, agent_bridge, rate_limit]
    secrets: [agent_internal_token, session_signing_secret]
    group_add: ["${SALTACODE_SECRET_GID:-1000}"]
    labels: {com.saltacode.component: backend}

  redis:
    <<: *runtime-defaults
    image: ${SALTACODE_REDIS_IMAGE:?set SALTACODE_REDIS_IMAGE to an immutable digest}
    user: "${SALTACODE_REDIS_UID:-999}:${SALTACODE_REDIS_GID:-999}"
    command: ["redis-server", "--bind", "0.0.0.0", "--protected-mode", "no", "--save", "", "--appendonly", "no", "--dir", "/tmp", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--loglevel", "warning"]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1770,uid=${SALTACODE_REDIS_UID:-999},gid=${SALTACODE_REDIS_GID:-999}
    pids_limit: 96
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 128M, pids: 96}
    networks: [rate_limit]
    labels: {com.saltacode.component: rate-limit}

networks:
  ingress:
    ipam:
      config:
        - subnet: ${SALTACODE_INGRESS_SUBNET:-10.248.244.64/28}
  frontend_backend:
    internal: true
    ipam:
      config:
        - subnet: ${SALTACODE_FRONTEND_BACKEND_SUBNET:-10.248.244.32/28}
  rate_limit:
    internal: true
    ipam:
      config:
        - subnet: ${SALTACODE_RATE_LIMIT_SUBNET:-10.248.244.48/28}
  agent_bridge:
    external: true
    name: saltacode_agent_bridge

secrets:
  agent_internal_token:
    file: ${SALTACODE_AGENT_INTERNAL_TOKEN_SOURCE_FILE:?set SALTACODE_AGENT_INTERNAL_TOKEN_SOURCE_FILE}
  session_signing_secret:
    file: ${SALTACODE_SESSION_SIGNING_SECRET_SOURCE_FILE:?set SALTACODE_SESSION_SIGNING_SECRET_SOURCE_FILE}
