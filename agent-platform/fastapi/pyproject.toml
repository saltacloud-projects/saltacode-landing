[project]
name = "agent-platform"
version = "2.0.0"
description = "Channel-neutral agent, RAG and integration platform"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Framework
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",

    # Validación y configuración
    "pydantic==2.10.3",
    "pydantic-settings==2.15.0",

    # Base de datos — async
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.1",
    "pgvector==0.5.0",

    # Redis — async
    "redis==8.1.0",

    # HTTP client for configured sources and channel providers
    "httpx==0.28.1",

    # Formularios / multipart (necesario para FastAPI con File uploads)
    "python-multipart==0.0.32",

    # OpenAI — clasificador LLM y respuestas documentales
    "openai==3.5.0",

    # TOON — Token-Oriented Object Notation (30-60% menos tokens que JSON)
    "python-toon==0.1.3",

    # Logging estructurado (JSON)
    "python-json-logger==4.2.0",

    # Document extraction
    "openpyxl==3.1.5",

    # Parseo de PDF — documentos internos (procedimientos, manuales)
    "pypdf==6.16.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "xlrd==2.0.2",
    "filetype==1.2.0",
    "tiktoken==0.14.0",

    # Admin panel — JWT + password hashing
    "PyJWT[crypto]==2.13.0",
    "cryptography>=50.0.1,<51.0",
    "bcrypt>=4.0",
    "pydantic[email]==2.10.3",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: requires external infrastructure such as PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"tests/*.py" = ["E402"]
