name: saltacode-agent-platform

x-agent-environment: &agent-environment
  FASTAPI_ENV: ${FASTAPI_ENV:-development}
  APP_VERSION: ${APP_VERSION:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  FASTAPI_API_KEY_FILE: /run/secrets/internal_api_token
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL}
  ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
  ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:23000}
  CREDENTIAL_ENCRYPTION_KEY_SOURCE_FILE: /run/secrets/source_master_key
  CREDENTIAL_ENCRYPTION_KEY_FILE: /run/agent-secrets/source_master.key
  CONTACT_ENCRYPTION_KEY_SOURCE_FILE: /run/secrets/contact_data_key
  CONTACT_ENCRYPTION_KEY_FILE: /run/agent-secrets/contact_data.key
  CONTACT_LOOKUP_HMAC_KEY_SOURCE_FILE: /run/secrets/contact_lookup_hmac_key
  CONTACT_LOOKUP_HMAC_KEY_FILE: /run/agent-secrets/contact_lookup_hmac.key
  DEFAULT_AGENT_SLUG: ${DEFAULT_AGENT_SLUG:-saltacode}
  RETENTION_SWEEP_INTERVAL_SECONDS: ${RETENTION_SWEEP_INTERVAL_SECONDS:-21600}
  DOMAIN: ${DOMAIN:-localhost}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  OPENAI_WHISPER_MODEL: ${OPENAI_WHISPER_MODEL:-whisper-1}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_INBOX_WORKER_ID: ${WHATSAPP_INBOX_WORKER_ID:-whatsapp-inbox-worker-1}
  WHATSAPP_INBOX_POLL_SECONDS: ${WHATSAPP_INBOX_POLL_SECONDS:-1}
  WHATSAPP_INBOX_STALE_SECONDS: ${WHATSAPP_INBOX_STALE_SECONDS:-1200}
  WHATSAPP_INBOX_MAX_ATTEMPTS: ${WHATSAPP_INBOX_MAX_ATTEMPTS:-5}
  OUTBOUND_WORKER_ID: ${OUTBOUND_WORKER_ID:-outbound-worker-1}
  OUTBOUND_WORKER_POLL_SECONDS: ${OUTBOUND_WORKER_POLL_SECONDS:-1}
  OUTBOUND_WORKER_MAX_BACKOFF_SECONDS: ${OUTBOUND_WORKER_MAX_BACKOFF_SECONDS:-30}
  OUTBOUND_DISPATCH_STALE_SECONDS: ${OUTBOUND_DISPATCH_STALE_SECONDS:-300}
  FOLLOW_UP_WORKER_ID: ${FOLLOW_UP_WORKER_ID:-follow-up-worker-1}
  FOLLOW_UP_WORKER_POLL_SECONDS: ${FOLLOW_UP_WORKER_POLL_SECONDS:-1}
  FOLLOW_UP_WORKER_MAX_BACKOFF_SECONDS: ${FOLLOW_UP_WORKER_MAX_BACKOFF_SECONDS:-30}
  FOLLOW_UP_EXECUTION_LEASE_SECONDS: ${FOLLOW_UP_EXECUTION_LEASE_SECONDS:-120}
  WEB_EXECUTION_WORKER_ID: ${WEB_EXECUTION_WORKER_ID:-web-execution-worker-1}
  WEB_EXECUTION_WORKER_POLL_SECONDS: ${WEB_EXECUTION_WORKER_POLL_SECONDS:-1}
  WEB_EXECUTION_WORKER_MAX_BACKOFF_SECONDS: ${WEB_EXECUTION_WORKER_MAX_BACKOFF_SECONDS:-30}
  WEB_EXECUTION_LEASE_SECONDS: ${WEB_EXECUTION_LEASE_SECONDS:-1200}
  DOCUMENT_STORAGE_ROOT: /data/documents

x-api-base: &api-base
  image: localhost/saltacode/agent-platform-api:${APP_VERSION:-dev}
  build:
    context: ./api
    dockerfile: Dockerfile
  environment: *agent-environment
  secrets:
    - source: internal_api_token
      target: internal_api_token
      mode: "0400"
    - source: source_master_key
      target: source_master_key
      mode: "0400"
    - source: contact_data_key
      target: contact_data_key
      mode: "0400"
    - source: contact_lookup_hmac_key
      target: contact_lookup_hmac_key
      mode: "0400"
  volumes:
    - document_data:/data/documents
  networks:
    - private
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    # Entrypoint-only capabilities: read protected sources, install appuser-owned
    # copies, then drop uid/gid before the long-running command.
    - CHOWN
    - DAC_READ_SEARCH
    - SETGID
    - SETUID

services:
  postgres:
    image: pgvector/pgvector:0.8.3-pg16-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "${REDIS_MAX_MEMORY:-256mb}", "--maxmemory-policy", "noeviction", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *api-base
    restart: "no"
    command: ["alembic", "-c", "alembic-platform.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    <<: *api-base
    restart: "no"
    command: ["python", "-m", "app.bootstrap"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api-base
    restart: unless-stopped
    ports:
      - "${AGENT_API_BIND_ADDRESS:-0.0.0.0}:${AGENT_API_PORT:-28082}:8000"
    networks:
      private:
      integration:
        aliases:
          - agent-platform
      egress:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G

  rag-worker:
    <<: *api-base
    profiles: ["rag"]
    restart: unless-stopped
    command: ["python", "-m", "app.workers.rag"]
    healthcheck:
      disable: true
    networks:
      - private
      - egress
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G

  whatsapp-worker:
    <<: *api-base
    restart: unless-stopped
    command: ["python", "-m", "app.workers.whatsapp_inbox"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/usr/local/libexec/agent-entrypoint.py",
          "python",
          "-m",
          "app.workers.whatsapp_inbox",
          "--healthcheck",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks:
      - private
      - egress
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      # Strict conversation ordering is guaranteed only with one worker replica.
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  outbound-worker:
    <<: *api-base
    restart: unless-stopped
    command: ["python", "-m", "app.workers.outbound"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/usr/local/libexec/agent-entrypoint.py",
          "python",
          "-m",
          "app.workers.outbound",
          "--healthcheck",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks:
      - private
      - egress
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      # Provider delivery is fail-closed and ordered per conversation.
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  follow-up-worker:
    <<: *api-base
    restart: unless-stopped
    command: ["python", "-m", "app.workers.follow_ups"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/usr/local/libexec/agent-entrypoint.py",
          "python",
          "-m",
          "app.workers.follow_ups",
          "--healthcheck",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      # PostgreSQL claims are replica-safe; start with one worker until load justifies more.
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 384M

  web-execution-worker:
    <<: *api-base
    restart: unless-stopped
    command: ["python", "-m", "app.workers.web_executions"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/usr/local/libexec/agent-entrypoint.py",
          "python",
          "-m",
          "app.workers.web_executions",
          "--healthcheck",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks:
      - private
      - egress
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    deploy:
      # Claim leases and FIFO execution currently require one active replica.
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  integration-tests:
    image: localhost/saltacode/agent-platform-api-tests:${APP_VERSION:-dev}
    build:
      context: ./api
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    restart: "no"
    environment:
      <<: *agent-environment
      FASTAPI_API_KEY_FILE: ""
      FASTAPI_API_KEY: integration-test-only
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pytest", "-q", "-m", "integration"]

  panel:
    image: localhost/saltacode/agent-platform-panel:${APP_VERSION:-dev}
    build:
      context: ./panel
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AGENT_PANEL_BIND_ADDRESS:-0.0.0.0}:${AGENT_PANEL_PORT:-23000}:80"
    networks:
      - ingress
      - private
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 6

networks:
  ingress:
    ipam:
      config:
        - subnet: 10.248.242.80/28
  private:
    internal: true
    ipam:
      config:
        - subnet: 10.248.242.0/28
  integration:
    name: saltacode_agent_bridge
    ipam:
      config:
        - subnet: 10.248.242.16/28
  egress:
    ipam:
      config:
        - subnet: 10.248.242.96/28

volumes:
  postgres_data:
    name: saltacode_agent_platform_postgres
  redis_data:
    name: saltacode_agent_platform_redis
  document_data:
    name: saltacode_agent_platform_documents

secrets:
  internal_api_token:
    file: ./.secrets/internal_api_token
  source_master_key:
    file: ./.secrets/source_master.key
  contact_data_key:
    file: ./.secrets/contact_data.key
  contact_lookup_hmac_key:
    file: ./.secrets/contact_lookup_hmac.key
