name: Platform quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        run: bash scripts/quality/verify.sh frontend

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Verify backend
        run: bash scripts/quality/verify.sh backend

  agent-api:
    name: Agent API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: agent-platform/fastapi/uv.lock

      - name: Install locked dependencies
        working-directory: agent-platform/fastapi
        run: uv sync --locked --all-groups

      - name: Verify agent API
        run: bash scripts/quality/verify.sh agent-api

  agent-panel:
    name: Agent administration panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agent-platform/frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: agent-platform/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: agent-platform/frontend
        run: npx playwright install --with-deps chromium

      - name: Verify agent panel
        run: bash scripts/quality/verify.sh agent-panel

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify infrastructure models
        run: bash scripts/quality/verify.sh infrastructure
