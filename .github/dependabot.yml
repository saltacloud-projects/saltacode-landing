version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Argentina/Salta
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: npm
    directories:
      - "/"
      - "/agent-platform/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:10"
      timezone: America/Argentina/Salta
    groups:
      javascript:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directories:
      - "/backend"
      - "/agent-platform/fastapi"
    schedule:
      interval: weekly
      day: monday
      time: "07:20"
      timezone: America/Argentina/Salta
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories:
      - "/frontend"
      - "/backend"
      - "/agent-platform/fastapi"
      - "/agent-platform/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Argentina/Salta
    groups:
      container-builds:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:40"
      timezone: America/Argentina/Salta
    groups:
      compose-images:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
