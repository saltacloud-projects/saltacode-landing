name: saltacode-sandbox

services:
  frontend:
    restart: "no"
    labels: {com.saltacode.environment: sandbox}
  backend:
    restart: "no"
    environment:
      SALTACODE_APP_ENV: development
    labels: {com.saltacode.environment: sandbox}
  redis:
    restart: "no"
    labels: {com.saltacode.environment: sandbox}
